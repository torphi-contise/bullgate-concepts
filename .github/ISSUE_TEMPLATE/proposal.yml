name: Improvement proposal
description: Propose a new page, example, or improvement to the documentation structure.
title: "[Proposal] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem faced by readers or integrators. Changes to behavior, architecture, scope, or visual identity must be discussed before a substantial implementation.

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Website and product overview
        - Technical documentation index
        - Bullgate Access integration
        - Policies
        - Identity resolution
        - Errors and messages
        - Repository process
        - New area
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem needs to be solved?
      description: Explain who is affected, when it occurs, and why the current content is insufficient.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change and the outcome it would produce for documentation users.
    validations:
      required: true

  - type: dropdown
    id: product-status
    attributes:
      label: Status of the described capability
      description: If the proposal concerns a capability, classify it honestly.
      options:
        - Not applicable; this is an editorial or process change
        - Implemented in the current version
        - Decided, but not yet implemented
        - Future possibility still under design
        - Unknown; further investigation is required
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: For implemented behavior, provide code, a contract, or another verifiable source.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Record other solutions and the relevant effects of each one.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and did not find an equivalent proposal.
          required: true
        - label: This proposal contains no credentials, personal data, or vulnerability details.
          required: true
        - label: I have read and agree to follow CODE_OF_CONDUCT.md.
          required: true
