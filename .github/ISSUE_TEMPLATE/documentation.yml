name: Documentation issue
description: Report incorrect content, a broken link, or a visual problem on Bullgate pages.
title: "[Documentation] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Bullgate documentation.
        Do not include credentials, personal data, or vulnerability details in this form. For security issues, follow SECURITY.md.

  - type: input
    id: location
    attributes:
      label: Page or file
      description: Provide the published URL, route, section, or path of the affected file.
      placeholder: https://bullgate.dev/docs/access/ or html/docs.html
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: Problem type
      options:
        - Incorrect technical content
        - Outdated content
        - Link or navigation
        - Desktop layout
        - Mobile layout or horizontal scrolling
        - Accessibility
        - Example or copy
        - Other documentation issue
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What happens today?
      description: Describe the problem objectively and reproducibly.
      placeholder: Provide the current text, behavior, or result.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen?
      description: Explain the expected correction without presenting future behavior as already implemented.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and context
      description: Add sources, version, browser, viewport width, or images without sensitive data.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and did not find an equivalent report.
          required: true
        - label: I removed credentials, personal data, and security-sensitive information from this public report.
          required: true
        - label: I have read and agree to follow CODE_OF_CONDUCT.md.
          required: true
