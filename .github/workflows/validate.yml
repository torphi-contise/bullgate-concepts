name: Validar repositório

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build, rotas e metadados
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Obter o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validar formatação dos arquivos comunitários
        shell: pwsh
        run: >-
          npx --yes prettier@3.6.2 --check
          README.md README.pt-BR.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md
          ".github/**/*.{yml,md}"

      - name: Validar build e navegação
        shell: pwsh
        run: .\scripts\validate-repository.ps1
